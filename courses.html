<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Courses</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <div class="logo">📚 Courses</div>
    <nav>
        <a href="/">Home</a>
        <a href="/register">Register</a>
        <a href="/students">Students</a>
        <a href="/courses">Courses</a>
    </nav>
</header>

<div class="table-container">
    <h2>Available Courses</h2>

    <table>
        <tr>
            <th>Course ID</th>
            <th>Course Name</th>
            <th>Credits</th>
            <th>Seats Available</th>
        </tr>

        {% for c in courses %}
        <tr>
            <td>{{ c[0] }}</td>
            <td>{{ c[1] }}</td>
            <td>{{ c[2] }}</td>
            <td>{{ c[3] }}</td>
        </tr>
        {% endfor %}
    </table>
</div>

</body>
</html>
