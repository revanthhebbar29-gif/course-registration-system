<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand">🎓 DBMS Dashboard</a>
        <div>
            <a href="/" class="btn btn-outline-light btn-sm">Home</a>
            <a href="/students" class="btn btn-outline-light btn-sm">Students</a>
            <a href="/courses" class="btn btn-outline-light btn-sm">Courses</a>
            <a href="/enrollment" class="btn btn-outline-light btn-sm">Enrollment</a>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <h2 class="text-center mb-4">📊 System Overview</h2>

    <div class="row">

        <div class="col-md-4">
            <div class="card text-white bg-primary mb-3 shadow">
                <div class="card-body text-center">
                    <h3>{{ students }}</h3>
                    <p>Total Students</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-white bg-success mb-3 shadow">
                <div class="card-body text-center">
                    <h3>{{ courses }}</h3>
                    <p>Total Courses</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-white bg-warning mb-3 shadow">
                <div class="card-body text-center">
                    <h3>{{ enrollments }}</h3>
                    <p>Total Enrollments</p>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
